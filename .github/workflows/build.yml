name: Build Driver Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DriverAssistantAndroid_MVP.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -q DriverAssistantAndroid_MVP.zip -d project

      - name: Fix JVM compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ["build.gradle", "build.gradle.kts"]:
              p = Path("project/app") / name
              if p.exists():
                  if name.endswith(".kts"):
                      code = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
                  else:
                      code = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
                  p.write_text(p.read_text() + "\n" + code)
                  print("Fixed:", p)
                  break
          else:
              raise SystemExit("ERROR: app Gradle file not found")
          PY

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Assistant-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
